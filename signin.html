<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in – my Dream Place</title>
    <style>
      :root {
        --blue: #2f80ed;
        --blue-dark: #2569c8;
        --facebook: #475993;
        --facebook-dark: #3b4a7d;
        --text: #1f1f1f;
        --muted: #555;
        --field: #f1f1f1;
        --border: #dcdcdc;
        --bg: #fff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }

      /* ---------- Header ---------- */
      .site-header {
        padding: 22px 50px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #333;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
      }

      .brand img {
        height: 18px;
        width: auto;
        display: block;
      }

      /* ---------- Layout ---------- */
      main {
        display: flex;
        justify-content: center;
        padding: 40px 20px 60px;
      }

      .signin {
        width: 100%;
        max-width: 340px;
      }

      .signin h1 {
        margin: 0 0 32px;
        text-align: center;
        font-size: 22px;
        font-weight: 600;
      }

      /* ---------- Form ---------- */
      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 600;
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap input {
        width: 100%;
        height: 40px;
        padding: 0 42px 0 12px;
        border: 1px solid transparent;
        border-radius: 3px;
        background: var(--field);
        color: var(--text);
        font: inherit;
      }

      .input-wrap input:focus {
        outline: none;
        border-color: var(--blue);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.18);
      }

      .toggle-pass {
        position: absolute;
        top: 0;
        right: 0;
        width: 42px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        background: none;
        color: #444;
        cursor: pointer;
      }

      .toggle-pass svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
      }

      .toggle-pass:focus-visible {
        outline: 2px solid var(--blue);
        border-radius: 3px;
      }

      .options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 4px 0 18px;
        font-size: 12px;
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        cursor: pointer;
      }

      .check input {
        appearance: none;
        width: 16px;
        height: 16px;
        margin: 0;
        border: 1px solid #bdbdbd;
        border-radius: 3px;
        background: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .check input:checked {
        background: var(--blue);
        border-color: var(--blue);
      }

      .check input:checked::after {
        content: "";
        width: 8px;
        height: 4px;
        border-left: 2px solid #fff;
        border-bottom: 2px solid #fff;
        transform: translateY(-1px) rotate(-45deg);
      }

      .check input:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      /* ---------- Buttons ---------- */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 3px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .btn:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      .btn svg {
        width: 16px;
        height: 16px;
      }

      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--blue-dark);
      }

      .btn-google {
        background: #fff;
        color: #333;
        border-color: var(--border);
      }
      .btn-google:hover {
        background: #f7f7f7;
      }

      .btn-facebook {
        background: var(--facebook);
        color: #fff;
      }
      .btn-facebook:hover {
        background: var(--facebook-dark);
      }

      .btn-facebook svg {
        fill: #fff;
      }

      /* ---------- Divider ---------- */
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0;
        color: var(--muted);
        font-size: 11px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e3e3e3;
      }

      .social {
        display: grid;
        gap: 8px;
      }

      /* ---------- Footer note ---------- */
      .register {
        margin: 36px 0 0;
        text-align: center;
        color: var(--muted);
        font-size: 12.5px;
      }

      @media (max-width: 600px) {
        .site-header {
          padding: 18px 20px;
        }
        main {
          padding-top: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="images/avion.png" alt="avion" />
        my Dream Place
      </a>
    </header>

    <main>
      <section class="signin" aria-labelledby="signin-title">
        <h1 id="signin-title">Sign in</h1>

        <form action="#" method="post">
          <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                class="toggle-pass"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="options">
            <label class="check">
              <input type="checkbox" name="remember" />
              Keep me signed in
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button class="btn btn-primary" type="submit">
            Continue with email
          </button>
        </form>

        <div class="divider">or use one of these options</div>

        <div class="social">
          <button class="btn btn-google" type="button">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"
              />
              <path
                fill="#4285F4"
                d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"
              />
              <path
                fill="#FBBC05"
                d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"
              />
            </svg>
            Continue with Google
          </button>

          <button class="btn btn-facebook" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h9.2v-7.4H10.2v-2.9h2.5V9.5c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2 .1 2.3.1v2.6h-1.6c-1.2 0-1.5.6-1.5 1.4v1.9h2.9l-.4 2.9h-2.5V22h4.8a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2z"
              />
            </svg>
            Continue with Facebook
          </button>
        </div>

        <p class="register">
          Don't have an account? <a href="register.html">Register</a>
        </p>
      </section>
    </main>

    <script>
      // Mostrar / ocultar contraseña
      const passInput = document.getElementById("password");
      const toggle = document.querySelector(".toggle-pass");

      toggle.addEventListener("click", () => {
        const show = passInput.type === "password";
        passInput.type = show ? "text" : "password";
        toggle.setAttribute("aria-pressed", String(show));
        toggle.setAttribute(
          "aria-label",
          show ? "Hide password" : "Show password",
        );
      });
    </script>
  </body>
</html>
